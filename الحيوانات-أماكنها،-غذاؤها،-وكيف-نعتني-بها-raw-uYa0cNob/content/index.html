      html, body { direction: rtl !important; }
      a[href*="articulate.com"] {
        display: none !important;
      }
    </style>

  <body>
    <div id="app"></div>
    
    <script src="lib/rise/87e760e2.js"></script>

    <script>
    (function() {
      const ARABIC_START = "ابدأ الدرس";
      document.documentElement.setAttribute("dir", "rtl");
      document.documentElement.setAttribute("lang", "ar");

      function cleanAndLocalize(root = document) {
        // 1. إخفاء رابط وعبارة Powered by Articulate فقط
        root.querySelectorAll('a[href*="articulate.com"]').forEach(el => {
          el.style.setProperty("display", "none", "important");
        });
        root.querySelectorAll('div, span, a, footer, p').forEach(el => {
          if (el.children.length === 0 && /^powered by articulate/i.test(el.textContent.trim())) {
            el.style.setProperty("display", "none", "important");
          }
        });

        // 2. تعريب زر البداية
        root.querySelectorAll('button, a, [role="button"], [role="link"]').forEach(el => {
          const txt = (el.textContent || "").trim();
          const aria = (el.getAttribute("aria-label") || "").trim();
          if (/^(start|begin|start course|get started|enter course|continue)$/i.test(txt) || /^(start|begin|start course|get started|enter course|continue)$/i.test(aria)) {
            el.setAttribute("dir", "rtl");
            el.setAttribute("lang", "ar");
            el.setAttribute("aria-label", ARABIC_START);
            if (el.children.length === 0) {
              el.textContent = ARABIC_START;
            } else {
              const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
              let node;
              while ((node = walker.nextNode())) {
                if (node.nodeValue && /^(start|begin|start course|get started|enter course|continue)$/i.test(node.nodeValue.trim())) {
                  node.nodeValue = ARABIC_START;
                }
              }
            }
          }
        });

        // 3. كتم أي عنصر صوت أو فيديو
        root.querySelectorAll('audio, video').forEach(m => {
          m.muted = true;
          m.defaultMuted = true;
          m.volume = 0;
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => cleanAndLocalize());
      } else {
        cleanAndLocalize();
      }

      new MutationObserver(() => cleanAndLocalize()).observe(document.documentElement, {
        childList: true,
        subtree: true
      });
    })();
    </script>
  </body>
</html>
